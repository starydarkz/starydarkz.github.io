baseURL = "https://starydarkz.github.io/"
languageCode = "es-419"
title = "El blog de Stary"
theme = "starfield"
paginate = 9
enableRobotsTXT = true
enableEmoji = true

[params]
  author   = "El blog de Stary"
  description = "Threat Detection/Hunting, Cyber Threat Intellence, Automatizacion y otras curiosidades"
  avatar   = "/images/avatar.jpg"
  bio      = "Threat Detection/Hunting, Cyber Threat Intellence, Automatizacion y otsssras curiosidades..."
  linkedin = "https://www.linkedin.com/in/enddyfigueroa/"
  telegram = "https://t.me/StaryDarkz"
  github   = "https://github.com/StaryDarkz"
  thm_url  = "https://tryhackme.com/p/StaryDarkz"
  ld_url   = "https://app.letsdefend.io/user/profile/StaryDarkz"

[menu]
  [[menu.main]]
    name   = "Inicio"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "Blog"
    url    = "/posts/"
    weight = 2
  [[menu.main]]
    name   = "Proyectos"
    url    = "/proyectos/"
    weight = 3
  [[menu.main]]
    name   = "Sobre mí"
    url    = "/about/"
    weight = 4

[taxonomies]
  tag      = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style              = "monokai"
    lineNos            = true
    lineNumbersInTable = false
    tabWidth           = 2
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]