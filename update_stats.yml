name: Update Platform Stats

on:
  schedule:
    # Runs every day at 03:00 UTC (medianoche RD aprox)
    - cron: "0 3 * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit hugo.toml back to the repo

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stats updater
        run: python scripts/update_stats.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet hugo.toml && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated stats
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hugo.toml
          git commit -m "chore: update platform stats [$(date +'%Y-%m-%d')]"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "Stats unchanged — no commit needed."
